# Checks every PR and every push to main. `fmt`, `clippy-test` and `deny` are the ruleset's required status checks:
# keep their names. `windows`, `musl-hook` and `windows-wsl` (the Windows preview) are not required yet. `advisories`
# (RustSec) is informational: it also runs weekly, so new advisories show up without blocking merges.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: advisories only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # the version in rust-toolchain.toml
      - run: cargo fmt --all --check

  clippy-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build packages (the list install.sh checks)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends $(scripts/install.sh --print-deps)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Tests that open a window are #[ignore]d.
      - run: cargo test --locked

  windows:
    if: github.event_name != 'schedule'
    # C is compiled with clang-cl (.cargo/config.toml); LLVM is on the runner.
    runs-on: windows-latest
    steps:
      # Byte-exact fixtures and LF-only test expectations: no CRLF conversion in the checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      # ConPTY sessions, PowerShell/cmd cwd reports, named pipes; window tests are #[ignore]d. All crates even when
      # one fails: the Windows suite still finds its gaps. DIRIGENT_TEST_VHD: Recycle Bin tests attach a fresh VHD and a
      # subst drive (admin, which the runner has).
      - run: cargo test --locked --no-fail-fast
        env:
          DIRIGENT_TEST_VHD: "1"
      # Release builds compile gpui's shaders with fxc.exe (Windows SDK): checked here, not first at a release.
      - run: cargo build --release --locked

  # The Linux helper WSL sessions run (static musl: any distro), for windows-wsl and later the Windows zip.
  musl-hook:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p hook --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dirigent-hook-linux-musl
          path: target/x86_64-unknown-linux-musl/release/dirigent-hook
          if-no-files-found: error

  # WSL sessions against a real distro (Ubuntu on WSL 2): git through wsl.exe, the helper relaying to the app's
  # pipe, a session's shim and cwd reports, and what one panel refresh costs. Not required yet.
  windows-wsl:
    if: github.event_name != 'schedule'
    needs: musl-hook
    runs-on: windows-latest
    env:
      DIRIGENT_TEST_WSL: Ubuntu-24.04
      DIRIGENT_TEST_WSL_HOOK: ${{ github.workspace }}\wsl-hook\dirigent-hook
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dirigent-hook-linux-musl
          path: wsl-hook
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: git
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The spawn count in wsl_refresh_cost is process-wide: one test at a time.
      - run: cargo test --locked -p git --test wsl -- --test-threads=1 --nocapture
      - run: cargo test --locked -p hook --test bin wsl_ -- --nocapture
      # The app's session test runs the helper binary the hook crate builds.
      - run: cargo build --locked -p hook && cargo test --locked -p dirigent wsl_ -- --nocapture

  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      # Licenses (no GPL/AGPL), allowed sources, bans: deny.toml.
      - run: cargo deny --locked check licenses sources bans

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      # RustSec: not a required check, so a new advisory never blocks a merge; ignores with reasons in deny.toml.
      - run: cargo deny --locked check advisories
