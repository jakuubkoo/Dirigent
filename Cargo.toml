[workspace]
resolver = "3"
members = ["crates/session", "crates/app", "crates/hook"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# gpui has no usable crates.io release (0.2.2 is from 2025-10): pinned Zed git rev. Bump procedure in CLAUDE.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e", features = ["wayland", "x11"] }
alacritty_terminal = "=0.26.0"
portable-pty = "=0.9.0"
session = { path = "crates/session" }
hook = { path = "crates/hook" }

# Cargo ignores a dependency's [patch]: these mirror Zed's root Cargo.toml at the pinned rev.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.release]
lto = "thin"
debug = 1
