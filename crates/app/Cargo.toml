[package]
name = "dirigent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
session.workspace = true
hook.workspace = true
git.workspace = true
syntax.workspace = true
serde_json = "1"
# Transcript prefilter in history.rs; already in the graph (git, regex).
memchr = "2"
serde = { version = "1", features = ["derive"] }
async-channel = "2.5"
# The editor's text buffer (MIT). LF-only line breaks: CRLF is normalized on load, lone CR makes a file read-only.
ropey = { version = "=1.6.1", default-features = false, features = ["simd"] }
# Watches settings.json for hand edits (the workspace's pinned fork, already built for the git crate).
notify.workspace = true
# The X11 window icon (gpui takes an RgbaImage); already in gpui's graph.
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version gpui uses; only to see whether the compositor offers blur (blur.rs).
wayland-client = "0.31.15"
# Desktop notifications (notify.rs). All already in gpui's graph (same versions/features): nothing new is built.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Process liveness for the stale runtime-dir sweep, console attach and the log handles; already in the graph.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
