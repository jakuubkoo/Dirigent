[package]
name = "syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
imara-diff = "=0.2.0"
tree-sitter-rust = "0.24.2"
tree-sitter-php = "0.25.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-css = "0.25.0"
tree-sitter-scss = "1.0.0"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.4"
tree-sitter-bash = "0.25.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
# Only its highlights query is used (tree-sitter-cpp's query extends C's); the C parser isn't referenced, so it
# isn't linked.
tree-sitter-c = "0.24.1"
# Not on crates.io; MIT, pinned to a reviewed commit.
tree-sitter-twig = { git = "https://github.com/gbprod/tree-sitter-twig", rev = "2208d2a3c3ee7ef378e97df2e51c18feb7ee9dfc" }
